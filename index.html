<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DSA Deep Roadmap (30 Days)</title>
<style>
  body { font-family: Arial; margin: 20px; background: #f5f5f5; max-width: 900px; }
  h1 { text-align: center; }
  .day { background: #fff; padding: 12px; margin: 12px 0; border-radius: 6px; }
  .topic { font-weight: bold; margin-top: 6px; }
  ul { margin: 5px 0 10px 20px; }
  .done { text-decoration: line-through; color: gray; }
</style>
</head>
<body>

<h1>DSA Deep Roadmap (Interview Ready)</h1>
<div id="roadmap"></div>

<script>
const data = [
  {
    day: "Day 1-2",
    title: "Arrays + Hashing",
    topics: [
      "Array",
      "Hash Table",
      "Counting",
      "Frequency maps",
      "Two Sum",
      "Group Anagrams"
    ]
  },
  {
    day: "Day 3-4",
    title: "Strings + Two Pointers",
    topics: [
      "String",
      "Two Pointers",
      "String manipulation",
      "Palindrome problems",
      "String matching basics"
    ]
  },
  {
    day: "Day 5-6",
    title: "Sliding Window + Prefix Sum",
    topics: [
      "Sliding Window",
      "Fixed vs variable window",
      "Prefix Sum",
      "Subarray Sum",
      "Prefix Sum + Hash Map"
    ]
  },
  {
    day: "Day 7",
    title: "Stack + Queue",
    topics: [
      "Stack",
      "Queue",
      "Bracket Sequences",
      "Monotonic Stack basics",
      "Floyd's Cycle Finding Algorithm"
    ]
  },
  {
    day: "Day 8-9",
    title: "Binary Search + Sorting",
    topics: [
      "Binary Search",
      "First/last occurrence",
      "Binary Search on Answer",
      "Merge Sort",
      "Quick Sort",
      "Counting Sort"
    ]
  },
  {
    day: "Day 10-11",
    title: "Linked List + Recursion",
    topics: [
      "Linked List",
      "Doubly-Linked List",
      "Recursion",
      "Reverse Linked List",
      "Fast and slow pointers",
      "Recursive problem solving"
    ]
  },
  {
    day: "Day 12-13",
    title: "Trees + Binary Trees",
    topics: [
      "Tree",
      "Binary Tree",
      "DFS",
      "BFS",
      "Inorder / Preorder / Postorder",
      "Height / Diameter",
      "Lowest Common Ancestor"
    ]
  },
  {
    day: "Day 14-15",
    title: "Graphs",
    topics: [
      "Graph Theory",
      "DFS",
      "BFS",
      "Connected Components",
      "Cycle Detection",
      "Grid Problems",
      "Graph Coloring"
    ]
  },
  {
    day: "Day 16",
    title: "Topological Sort + DAG",
    topics: [
      "Topological Sort",
      "Directed Acyclic Graph",
      "Kahn's Algorithm",
      "DFS Topological Sort",
      "Course Schedule Problems"
    ]
  },
  {
    day: "Day 17",
    title: "Union-Find",
    topics: [
      "Union-Find",
      "Path Compression",
      "Union by Rank",
      "Cycle Detection",
      "Connected Components"
    ]
  },
  {
    day: "Day 18-19",
    title: "Heap + Priority Queue",
    topics: [
      "Heap (Priority Queue)",
      "Top K Elements",
      "Kth Largest / Smallest",
      "Merge K Sorted Lists",
      "Heap vs Sorting"
    ]
  },
  {
    day: "Day 20",
    title: "Greedy",
    topics: [
      "Greedy",
      "Interval Scheduling",
      "Jump Game",
      "Gas Station",
      "Greedy Decision Making"
    ]
  },
  {
    day: "Day 21-24",
    title: "Dynamic Programming",
    topics: [
      "Dynamic Programming",
      "Memoization",
      "1D DP",
      "2D DP",
      "Knapsack",
      "LIS",
      "LCS",
      "State Transition"
    ]
  },
  {
    day: "Day 25",
    title: "Advanced Stack + Queue",
    topics: [
      "Monotonic Stack",
      "Monotonic Queue",
      "Next Greater Element",
      "Daily Temperatures",
      "Largest Rectangle in Histogram"
    ]
  },
  {
    day: "Day 26",
    title: "Bit Manipulation + Math",
    topics: [
      "Bit Manipulation",
      "Bitmask",
      "XOR",
      "Power of 2",
      "Greatest Common Divisor",
      "Least Common Multiple",
      "Prime Number Sieve"
    ]
  },
  {
    day: "Day 27",
    title: "Trie + String Algorithms",
    topics: [
      "Trie",
      "Prefix Matching",
      "String Matching",
      "Rolling Hash",
      "Knuth-Morris-Pratt Algorithm",
      "Z Algorithm"
    ]
  },
  {
    day: "Day 28",
    title: "Advanced Trees + Range Queries",
    topics: [
      "Segment Tree",
      "Binary Indexed Tree",
      "Sparse Table",
      "Binary Search Tree",
      "Binary Lifting"
    ]
  },
  {
    day: "Day 29",
    title: "Advanced Graph Algorithms",
    topics: [
      "Shortest Path",
      "Dijkstra's Algorithm",
      "Bellman-Ford Algorithm",
      "Floyd-Warshall Algorithm",
      "Minimum Spanning Tree",
      "Kruskal's Algorithm",
      "Prim's Algorithm"
    ]
  },
  {
    day: "Day 30",
    title: "Advanced Algorithms + Revision",
    topics: [
      "Backtracking",
      "Divide and Conquer",
      "Combinatorics",
      "Game Theory",
      "Maximum Flow",
      "Strongly Connected Components",
      "Random Problems",
      "Mock Interviews"
    ]
  }
];

const container = document.getElementById("roadmap");

data.forEach((d) => {
  const div = document.createElement("div");
  div.className = "day";

  const header = document.createElement("div");
  header.innerHTML = "<strong>" + d.day + " - " + d.title + "</strong>";

  div.appendChild(header);

  d.topics.forEach(t => {
    const label = document.createElement("div");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    const span = document.createElement("span");
    span.innerText = " " + t;

    checkbox.addEventListener("change", () => {
      span.classList.toggle("done");
    });

    label.appendChild(checkbox);
    label.appendChild(span);
    div.appendChild(label);
  });

  container.appendChild(div);
});
</script>

</body>
</html>
