<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DSA Deep Roadmap (30 Days)</title>
<style>
  body { font-family: Arial; margin: 20px; background: #f5f5f5; max-width: 900px; }
  h1 { text-align: center; }
  .day { background: #fff; padding: 12px; margin: 12px 0; border-radius: 6px; }
  .topic { font-weight: bold; margin-top: 6px; }
  ul { margin: 5px 0 10px 20px; }
  .done { text-decoration: line-through; color: gray; }
</style>
</head>
<body>

<h1>DSA Deep Roadmap (Interview Ready)</h1>
<div id="roadmap"></div>

<script>
const data = [
{
day: "Day 1-2",
title: "Arrays + Hashing",
topics: [
"Frequency map (counting)",
"Two sum / variants",
"Group anagrams",
"Top K frequent elements"
]
},
{
day: "Day 3-4",
title: "Two Pointers",
topics: [
"Pair sum sorted",
"3Sum",
"Remove duplicates in-place",
"Container with most water"
]
},
{
day: "Day 5-6",
title: "Sliding Window",
topics: [
"Max sum subarray",
"Longest substring without repeating",
"Minimum window substring",
"Fixed vs variable window"
]
},
{
day: "Day 7",
title: "Prefix Sum",
topics: [
"Range sum queries",
"Subarray sum equals K",
"Continuous subarray sum",
"Prefix + hashmap combo"
]
},
{
day: "Day 8-9",
title: "Binary Search",
topics: [
"Classic binary search",
"First/last occurrence",
"Search in rotated array",
"Binary search on answer (VERY IMPORTANT)"
]
},
{
day: "Day 10-11",
title: "Recursion + Backtracking",
topics: [
"Subsets",
"Permutations",
"Combination sum",
"Backtracking template (choose-explore-unchoose)"
]
},
{
day: "Day 12-13",
title: "Trees",
topics: [
"DFS (inorder, preorder, postorder)",
"Level order (BFS)",
"Height / diameter",
"Lowest Common Ancestor"
]
},
{
day: "Day 14-15",
title: "Graphs",
topics: [
"BFS / DFS traversal",
"Cycle detection",
"Connected components",
"Grid problems (islands)"
]
},
{
day: "Day 16",
title: "Topological Sort",
topics: [
"Kahn’s algorithm",
"DFS topo sort",
"Course schedule problems"
]
},
{
day: "Day 17",
title: "Union Find (DSU)",
topics: [
"Path compression",
"Union by rank",
"Cycle detection",
"Connected components optimization"
]
},
{
day: "Day 18-19",
title: "Heap / Priority Queue",
topics: [
"Top K elements",
"Kth largest/smallest",
"Merge k sorted lists",
"Heap vs sorting"
]
},
{
day: "Day 20",
title: "Greedy",
topics: [
"Interval scheduling",
"Jump game",
"Gas station",
"When greedy works (key insight)"
]
},
{
day: "Day 21-24",
title: "Dynamic Programming",
topics: [
"1D DP (climbing stairs, house robber)",
"2D DP (grid paths)",
"Knapsack pattern",
"LIS (important)",
"LCS (important)",
"State transition thinking"
]
},
{
day: "Day 25",
title: "Monotonic Stack",
topics: [
"Next greater element",
"Daily temperatures",
"Largest rectangle in histogram"
]
},
{
day: "Day 26",
title: "Bit Manipulation",
topics: [
"XOR basics",
"Single number",
"Bit masking for subsets",
"Power of 2 tricks"
]
},
{
day: "Day 27",
title: "Trie",
topics: [
"Insert/search",
"Prefix matching",
"Word search problems"
]
},
{
day: "Day 28",
title: "Intervals",
topics: [
"Merge intervals",
"Insert interval",
"Meeting rooms",
"Overlap logic"
]
},
{
day: "Day 29-30",
title: "Revision + Mixed",
topics: [
"Random problems from all patterns",
"Focus on weak areas",
"Timed practice (important)",
"Mock interviews"
]
}
];

const container = document.getElementById("roadmap");

data.forEach((d) => {
  const div = document.createElement("div");
  div.className = "day";

  const header = document.createElement("div");
  header.innerHTML = "<strong>" + d.day + " - " + d.title + "</strong>";

  div.appendChild(header);

  d.topics.forEach(t => {
    const label = document.createElement("div");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    const span = document.createElement("span");
    span.innerText = " " + t;

    checkbox.addEventListener("change", () => {
      span.classList.toggle("done");
    });

    label.appendChild(checkbox);
    label.appendChild(span);
    div.appendChild(label);
  });

  container.appendChild(div);
});
</script>

</body>
</html>
